services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: instantly_agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${AGENTS_DATABASE_PASSWORD:-agents-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agents-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d instantly_agents"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agents-postgres:
